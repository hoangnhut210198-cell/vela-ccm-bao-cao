.bao{margin-top:14px;font-size:13px;min-height:19px;line-height:1.5}
.loi{color:#c0392b}
.cho{color:#6b7280}

  input{background:#15161c;border-color:#343747;color:#e8e9ee}
  .chan{border-top-color:#2c2f3c;color:#767c8c}
}

const KHOA_PHIEN = "vela_ccm_mk";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bao = document.getElementById("bao");
const nut = document.getElementById("nut");

async function mo(mk, tudong) {
  nut.disabled = true;
  bao.className = "bao cho";
  bao.textContent = "Đang giải mã…";
  try {
    const enc = new TextEncoder();
    const goc = await crypto.subtle.importKey("raw", enc.encode(mk), "PBKDF2",
                                              false, ["deriveKey"]);
    const aes = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(G.salt), iterations: G.vong, hash: "SHA-256" },
      goc, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(G.iv) },
                                            aes, b64(G.ct));
    // Mật khẩu đúng — nhớ trong phiên này để các trang khác không phải hỏi lại.
    try { sessionStorage.setItem(KHOA_PHIEN, mk); } catch (e) {}
    const html = new TextDecoder().decode(raw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem(KHOA_PHIEN); } catch (e2) {}
    nut.disabled = false;
    bao.className = "bao loi";
    bao.textContent = tudong ? "Mật khẩu đã lưu không còn đúng. Nhập lại giúp em."
                             : "Mật khẩu không đúng.";
    document.getElementById("mk").select();
  }
}

document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const mk = document.getElementById("mk").value;
  if (mk) mo(mk, false);
});

// Đã mở khoá ở trang khác trong cùng phiên thì vào thẳng.
(function () {
  let mk = null;
  try { mk = sessionStorage.getItem(KHOA_PHIEN); } catch (e) {}
  if (mk) mo(mk, true);
})();
</script>
